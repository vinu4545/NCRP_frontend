<!doctype html>
<style>
body{background:radial-gradient(circle at 92% 3%,rgba(37,99,235,.08),transparent 27%),#f8fafc!important;color:#0f172a!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}#app{max-width:1240px!important;margin:24px auto!important;background:#fff!important;border:1px solid #e2e8f0!important;border-radius:16px!important;min-height:760px!important;box-shadow:0 4px 16px rgba(15,23,42,.06)!important;overflow:hidden!important}header{min-height:76px!important;padding:14px 30px!important;border-bottom:1px solid #e2e8f0!important;background:#fff!important;position:sticky!important;top:0!important;z-index:3!important}button{border-radius:10px!important;font-family:inherit!important}main{min-height:570px!important;padding:68px clamp(24px,10%,120px)!important}h1{font-family:Georgia,serif!important}input,textarea,select{border-radius:10px!important;font-family:inherit!important}
:root{--blue:#2563eb;--deep:#1d4ed8;--navy:#1e3a8a;--ink:#0f172a;--text:#475569;--muted:#64748b;--line:#e2e8f0;--surface:#f8fafc;--wash:#eff6ff;--green:#16a34a;--green-wash:#dcfce7;--amber:#d97706;--amber-wash:#fef3c7;--shadow:0 4px 16px rgba(15,23,42,.06);--lift:0 12px 32px rgba(15,23,42,.09)}
*{box-sizing:border-box}body{background:radial-gradient(circle at 92% 3%,rgba(37,99,235,.08),transparent 27%),var(--surface);color:var(--ink);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}#app{max-width:1240px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:16px;min-height:760px;box-shadow:var(--shadow);overflow:hidden}header{min-height:76px;padding:14px 30px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);position:sticky;top:0;z-index:3}.brand{color:var(--navy);font-size:10px;letter-spacing:.08em;text-align:left;line-height:1.35}.brand b{color:var(--ink);font-size:14px;letter-spacing:.01em}header .brand:before{content:"";display:inline-block;width:10px;height:10px;margin-right:9px;background:var(--green);border-radius:3px;box-shadow:0 0 0 5px var(--green-wash);vertical-align:1px}nav{display:flex;align-items:center;gap:3px}nav button{color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600}nav button:hover{background:var(--wash);color:var(--blue)}button{border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink);padding:10px 16px;cursor:pointer;font:600 14px/1.3 inherit;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease,color .2s ease}button:hover{border-color:#93b4f5;color:var(--blue);box-shadow:var(--shadow)}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.2);outline-offset:2px}.primary,.selected{background:linear-gradient(135deg,var(--blue),var(--deep));color:#fff;border-color:var(--blue);box-shadow:0 5px 12px rgba(37,99,235,.18)}.primary:hover,.selected:hover{background:linear-gradient(135deg,var(--deep),var(--navy));color:#fff;border-color:var(--deep);transform:translateY(-1px)}main{min-height:570px;padding:68px clamp(24px,10%,120px)}h1{font:700 clamp(29px,4vw,40px)/1.15 Georgia,serif;color:var(--ink);margin:0 0 18px}h2{font:700 25px/1.2 Georgia,serif;color:var(--ink)}p{color:var(--text);margin:8px 0 18px}.center{text-align:center;padding-top:72px}.center>p:first-child{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.14em}.choices{max-width:620px;margin:32px auto;display:grid;gap:14px}.choices button{padding:22px 24px;text-align:left;border-radius:14px;position:relative}.choices button:after{content:"->";position:absolute;right:22px;top:50%;font-size:21px;color:var(--blue);transform:translateY(-50%);transition:transform .2s ease}.choices button:hover{transform:translateY(-3px);border-color:#a8c5fa;box-shadow:var(--lift)}.choices button:hover:after{transform:translate(4px,-50%)}.choices b,.choices small{display:block;padding-right:28px}.choices b{font-size:17px}.choices small{margin-top:5px;color:var(--muted);font-weight:400}.two{grid-template-columns:1fr 1fr;max-width:760px}.two button{min-height:130px}label{display:block;color:var(--ink);font-weight:700;margin:20px 0}input,textarea,select{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;margin-top:7px;background:#fff;color:var(--ink);font:inherit;transition:border-color .2s,box-shadow .2s}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.1);outline:0}textarea{height:150px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.grid button{text-align:left;min-height:52px}.actions{margin-top:36px;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px}.step{display:inline-block;color:var(--deep);background:var(--wash);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;margin-bottom:25px}.casecols,.detail{display:grid;grid-template-columns:1fr 1fr;gap:48px}.casecols>div+div{border-left:1px solid var(--line);padding-left:48px}.case{border-top:1px solid var(--line);padding:19px 0;transition:padding .2s}.case:hover{padding-left:8px;border-color:#a8c5fa}.case b,.case span{display:block}.case b{font-size:16px}.case span{margin:4px 0;color:var(--text)}.case span:last-child{display:inline-block;margin-top:9px;background:var(--wash);color:var(--deep);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}.drawer{position:fixed;right:5%;top:22px;background:#fff;border:1px solid var(--line);border-radius:14px;width:340px;padding:25px;box-shadow:var(--lift);z-index:5}.notice{padding:18px 20px;background:var(--green-wash);border:1px solid #bbf7d0;border-radius:12px;color:#166534}.warn{color:#9a5b05;background:var(--amber-wash);padding:12px 14px;border-radius:9px}.review div{border-bottom:1px solid var(--line);padding:15px 70px 15px 0;position:relative}.review small{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}.review button{position:absolute;right:0;top:14px;padding:5px 9px;font-size:12px}.timeline li{padding:0 0 21px 22px;border-left:2px solid #bbf7d0;position:relative}.timeline li:before{content:"";position:absolute;left:-7px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-wash)}.timeline li:last-child{border-color:#93c5fd}.timeline li:last-child:before{background:var(--blue);box-shadow:0 0 0 4px var(--wash)}footer{border-top:1px solid var(--line)!important;padding:28px 30px!important;color:var(--muted);background:#fbfdff;line-height:1.8}footer span:first-line{color:var(--ink);font-weight:700}@media(max-width:650px){#app{margin:0;border-radius:0;border-left:0;border-right:0}header{padding:14px 18px}.brand{font-size:9px}nav{display:none}main{padding:38px 22px;min-height:600px}.center{padding-top:30px}.center h1{font-size:31px}.casecols,.detail,.two,.grid{grid-template-columns:1fr}.casecols>div+div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:26px}.actions{gap:12px}.actions button{flex:1}footer{display:grid!important;grid-template-columns:1fr 1fr;gap:20px;padding:24px 22px!important}.drawer{right:16px;left:16px;width:auto}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCRP</title><style>:root{--b:#075a9e;--i:#172a3b;--l:#c9d4dc}*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:var(--i);font:15px Arial,sans-serif}#app{max-width:1200px;margin:18px auto;background:#fff;border:1px solid #aebbc4;min-height:700px}header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:3px solid #164b72}.brand{font-size:11px}.brand b{display:block;font-size:14px}nav button{border:0;background:none;padding:6px 13px}button{border:1px solid #82919c;border-radius:5px;background:white;padding:9px 15px;cursor:pointer;font-size:14px}button:hover{border-color:var(--b);color:var(--b)}main{min-height:520px;padding:54px 10%}h1{font:600 34px Georgia,serif;margin:0 0 20px}h2{font:600 23px Georgia,serif}.center{text-align:center;padding-top:70px}.choices{max-width:520px;margin:25px auto;display:grid;gap:13px}.choices button{padding:17px}.choices b,.choices small{display:block}.choices b{font-size:17px}.choices small{margin-top:5px;color:#647484}.two{grid-template-columns:1fr 1fr;max-width:700px}.two button{min-height:115px}label{display:block;font-weight:bold;margin:17px 0}input,textarea,select{width:100%;padding:10px;border:1px solid #8796a2;border-radius:4px;margin-top:7px}textarea{height:130px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 0}.selected,.primary{background:var(--b);color:#fff;border-color:var(--b)}.actions{margin-top:28px;display:flex;justify-content:space-between;border-top:1px solid var(--l);padding-top:18px}.step{color:var(--b);font-size:13px;margin-bottom:25px}.casecols,.detail{display:grid;grid-template-columns:1fr 1fr;gap:55px}.casecols>div+div{border-left:1px solid var(--l);padding-left:45px}.case{border-top:1px solid var(--l);padding:15px 0}.case b,.case span{display:block}.case span{margin:4px 0}.drawer{position:fixed;right:5%;top:22px;background:white;border:1px solid #8e9ca7;width:340px;padding:25px;box-shadow:0 8px 24px #00204033}.notice{padding:13px;background:#edf6f0}.warn{color:#9c3e00}.review div{border-bottom:1px solid var(--l);padding:11px 70px 11px 0;position:relative}.review small{display:block;color:#5c6b76;font-weight:bold}.review button{position:absolute;right:0;top:10px;padding:3px 8px}.timeline li{padding:0 0 21px 18px;border-left:2px solid #78ae8b}.timeline{list-style:none;padding:0}.timeline li:last-child{border-color:#0b5d9f}@media(max-width:650px){#app{margin:0}.casecols,.detail,.two,.grid{grid-template-columns:1fr}.casecols>div+div{border-left:0;padding-left:0}nav{display:none}main{padding:32px 22px}}</style></head><body><div id="app"></div><script>let page='home',flow='crime',step=0,draft={},cases=JSON.parse(localStorage.cases||'null')||[{id:'CYB-20481',type:'Financial fraud',status:'Evidence requested',active:1},{id:'CYB-20492',type:'Account takeover',status:'Under investigation',active:1},{id:'CYB-17481',type:'UPI fraud',status:'Resolved'},{id:'CYB-19492',type:'Impersonation',status:'Closed'}];const $=s=>document.querySelector(s);function nav(p){page=p;render()}function head(){return `<header><button class="brand" onclick="nav('home')">NATIONAL CYBERCRIME<b>REPORTING PORTAL - NCRP</b></button><nav><button onclick="nav('home')">Home</button>|<button onclick="start('crime')">Report</button>|<button onclick="nav('cases')">My Cases</button>|<button onclick="drawer()">Notifications</button>|<button onclick="nav('profile')">Profile</button></nav></header>`}function foot(){return `<footer style="border-top:2px solid #557087;padding:22px;font-size:12px;display:flex;justify-content:space-between"><span>Citizen services<br>Report Cybercrime<br>Check suspicious identifier<br>Track complaint</span><span>Help<br>FAQs<br>Cyber safety<br>Contact / Support</span><span>Information<br>About NCRP<br>Privacy<br>Terms</span><span>Government resources<br>Official cybercrime resources</span></footer>`}function start(x){flow=x;step=0;draft={type:'UPI ID',reason:'Suspected financial fraud',encounter:'WhatsApp',evidence:[]};page='report';render()}function home(){return `<div class="center"><p style="color:#075a9e">CITIZEN SUPPORT PORTAL</p><h1>What do you need help with?</h1><div class="choices"><button onclick="start('crime')"><b>Something happened to me</b><small>Report a Cyber Crime</small></button><button onclick="nav('suspect')"><b>I found something suspicious</b><small>Check a suspicious identifier<br>UPI ID, Phone No, Bank Account, URL, etc.</small></button><button onclick="nav('cases')"><b>Track an existing Complaint</b><small>Track complaint</small></button></div></div>`}function suspect(){if(step===1)return `<h1>Check ${draft.type||'UPI ID'}</h1><p>Check whether a digital identifier has been previously reported as suspicious.</p><div class="grid">${['Mobile Number','Website URL','UPI ID','Transaction ID','Bank Account','Social Media Account','Email Address','Something Else'].map(x=>`<button class="${draft.type===x?'selected':''}" onclick="draft.type='${x}';render()">${x}</button>`).join('')}</div><label>Enter the ${draft.type}<input id="identifier"></label><button class="primary" onclick="step=2;draft.identifier=$('#identifier').value;render()">Check Identifier</button>`;if(step===2)return `<h1>Reports found</h1><div class="notice"><b>UPI ID</b><br>${draft.identifier||'example@upi'}<br><br><b>Reports associated</b><br>3<br><br><b>Category</b><br>Financial fraud</div><p class="warn">Reported before does not establish wrongdoing. Take care before making any payment.</p><button onclick="start('suspect')">Report this identifier</button>`;return `<div class="center"><h1>What do you want to do?</h1><div class="choices two"><button onclick="step=1;render()"><b>Check a suspicious identifier</b><small>See whether it has been reported before.</small></button><button onclick="start('suspect')"><b>Report a suspicious identifier</b><small>Tell us about a number, UPI ID, account, URL, etc.</small></button></div></div>`}function report(){let content=step===0?`<h1>${flow==='suspect'?'What are you reporting?':'What happened?'}</h1><div class="grid">${['Financial fraud','Account compromise','Impersonation','Suspicious activity','Other cybercrime','UPI ID','Mobile Number','Website URL'].map(x=>`<button onclick="draft.type='${x}';step=1;render()">${x}</button>`).join('')}</div>`:step===1?`<h1>Tell us a little more</h1><label>Why are you reporting it?<select id="reason"><option>Suspected financial fraud</option><option>Impersonation</option><option>Suspicious payment request</option></select></label><label>When did you encounter this?<input id="date" type="date"></label><label>How did you encounter it?<select id="enc"><option>WhatsApp</option><option>Email</option><option>Phone Call</option><option>Website</option></select></label>`:step===2?`<h1>Briefly describe what happened.</h1><textarea id="desc" placeholder="Tell us what happened in your own words."></textarea>`:step===3?`<h1>Just the last step.</h1><p>Do you have evidence? (Optional)</p>${['Screenshots','Messages','Payment details','Website / link','Other'].map(x=>`<label>${x}<input type="file"></label>`).join('')}<p>You can continue without uploading evidence.</p>`:step===4?`<h1>Your report is almost ready.</h1><p>This helps us contact you about your report.</p><label>Name<input id="name"></label><label>Mobile number<input id="mobile" placeholder="+91 XXXXX XXXXX"></label><button onclick="alert('OTP sent to your mobile number')">Send OTP</button><label>Enter OTP<input id="otp"></label><button onclick="alert($('#otp').value==='000000'?'OTP failed. Your report has been saved.':'Identity verified')">Verify OTP</button>`:`<h1>Review your report</h1><div class="review">${[['IDENTIFIER',draft.type],['REASON',draft.reason||'Suspected financial fraud'],['ENCOUNTERED',draft.encounter||'WhatsApp'],['DESCRIPTION',draft.desc||'Not provided'],['EVIDENCE','Optional']].map(x=>`<div><small>${x[0]}</small>${x[1]}<button>Edit</button></div>`).join('')}</div><label><input id="confirm" type="checkbox" style="width:auto"> I hereby confirm that the above provided information is correct.</label><button class="primary" onclick="submit()">Submit</button>`;return `<div class="step">Reporting a ${flow==='suspect'?'suspicious identifier':'cybercrime'} · Step ${step+1} of 6</div>${content}${step<5?`<div class="actions"><button onclick="step=Math.max(0,step-1);render()">Previous</button><button class="primary" onclick="save();step++;render()">Next</button></div>`:''}`}function save(){if(step===1){draft.reason=$('#reason').value;draft.date=$('#date').value;draft.encounter=$('#enc').value}if(step===2)draft.desc=$('#desc').value}function submit(){if(!$('#confirm').checked)return alert('Please confirm the information.');let id='CYB-'+Math.floor(20000+Math.random()*9999);cases.unshift({id,type:draft.reason||'Cybercrime report',status:'Submitted',active:1});localStorage.cases=JSON.stringify(cases);page='success';draft.id=id;render()}function caseview(c){return `<button onclick="nav('cases')">← My Cases</button><h1>${c.type}</h1><p><b>${c.id}</b> · ${c.status}</p><div class="detail"><div><h2>Action Center</h2><p>✓ Complaint registered</p><p>✓ Identity verified</p><p class="warn">⚠ Action required · Upload bank statement <button>Upload</button></p><h2>Evidence</h2><p>3 files submitted<br>2 additional items requested</p><h2>What happens next?</h2><p>We will notify you when your case progresses.</p></div><div><h2>Case Timeline</h2><ul class="timeline"><li>Submitted</li><li>Verified</li><li>Assigned</li><li>Under investigation</li></ul><button onclick="window.print()">Download Case PDF</button><h2>Grievance</h2><button>Raise a concern</button></div></div>`}function drawer(){document.body.insertAdjacentHTML('beforeend',`<div class="drawer"><button onclick="this.parentElement.remove()">×</button><h2>Notifications</h2><h3>Today</h3><p><b>⚠ Action required</b><br>Upload bank statement<br>CYB-20481</p><p><b>Case update</b><br>Your complaint was assigned.</p><h3>Yesterday</h3><p>✓ Complaint registered<br>CYB-20492</p></div>`)}function render(){let b=page==='home'?home():page==='suspect'?suspect():page==='report'?report():page==='cases'?`<h1>My Cases</h1><div class="casecols">${['Active Cases','Past Cases'].map((t,i)=>`<div><h2>${t}</h2>${cases.filter(c=>!!c.active===!i).map(c=>`<div class="case"><b>${c.id}</b><strong>${c.type}</strong><span>${c.status}</span><button onclick="page='case';draft.case='${c.id}';render()">${c.status==='Evidence requested'?'Continue':'View case'}</button></div>`).join('')}</div>`).join('')}</div>`:page==='case'?caseview(cases.find(c=>c.id===draft.case)||cases[0]):page==='success'?`<div class="center"><h1>✓ Report submitted</h1><h2>Your report has been received.</h2><p>Reference ID</p><h1 style="font-size:28px">SID-2026-018472</h1><p>We'll use this reference ID to identify your report.</p><button onclick="nav('cases')">Done</button></div>`:`<h1>Rahul Sharma</h1><p>+91 XXXXX XXXXX</p><p>rahul.sharma123@gmail.com</p><h2 style="margin-top:50px">Personal Information</h2><p>Age: XX<br>Gender: M/F<br>Address: ABC Area, XYZ</p><button>Sign out</button><button>Delete Account</button>`;$('#app').innerHTML=head()+`<main>${b}</main>`+foot()}render()</script></body></html>
