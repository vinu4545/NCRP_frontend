<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence | NCRP</title>
<link rel="stylesheet" href="../../style.css">
<style>.report-header{display:flex;align-items:center;justify-content:space-between;padding:16px 42px;border-bottom:2px solid var(--ink)}.report-header a{font-weight:700}.report-header-actions{display:flex;gap:28px;align-items:center}.report-header button{border:0;background:none;padding:0;font-weight:700}.report-header button:disabled{color:#9aa7af;cursor:not-allowed}.report-footer{display:block!important;text-align:center;border-top:2px solid var(--ink);padding:20px 28px!important}.help-title{font-weight:700;font-size:18px;margin-bottom:12px}.footer-brand{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-weight:700}.report-footer .footer-credit{border:0;padding-top:12px;margin-top:12px}.flow-next[aria-disabled="true"]{opacity:.45;cursor:not-allowed}@media(max-width:650px){.report-header{padding:16px 22px}.report-header-actions{gap:16px}.report-footer .footer-brand{font-size:14px}}</style>
</head>
<body>
<div class="shell">
<header class="report-header"><a href="../index.html">← Report cybercrime</a><div class="report-header-actions"><button type="button" data-save>Save</button><a href="../index.html">Exit</a></div></header>
<main>
<p class="eyebrow">Reporting a cybercrime · Step 3 of 5</p>
<h1>Just one last step</h1>
<p>Do you have evidence? <span class="muted">(Optional)</span>
</p>
<div class="grid">
<label>Screenshots<input type="file" accept="image/*">
</label>
<label>Payment details<input type="text" placeholder="Add details">
</label>
<label>Messages<input type="file">
</label>
<label>Website / link<input type="url" placeholder="Add URL">
</label>
</div>
<div class="actions">
<a class="button" href="report-description.html">Previous</a>
<a class="button primary flow-next" href="report-details.html" aria-disabled="true">Next</a>
</div>
</main>
<footer class="report-footer"><div class="help-title">Need Help?</div><div class="footer-brand"><span>NCRP</span><span>Government of India</span></div><div class="footer-credit">A Project made for "Build What Moves India" Hackathon by Varun Mayya</div></footer>
</div>
</body>
<script>(function(){var key='ncrp-report-step-3',save=document.querySelector('[data-save]'),next=document.querySelector('.flow-next');
function update(){next.setAttribute('aria-disabled',String(localStorage.getItem(key+'-saved')!=='1'))}save.addEventListener('click',function(){var values=[].slice.call(document.querySelectorAll('input')).map(function(field){return field.value});localStorage.setItem(key,JSON.stringify(values));localStorage.setItem(key+'-saved','1');update()});next.addEventListener('click',function(event){if(next.getAttribute('aria-disabled')==='true')event.preventDefault()});update()}())</script>
</html>
